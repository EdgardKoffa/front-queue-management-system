<p-card [header]="formTitle()" class="w-full p-4">

    <form [formGroup]="form" (ngSubmit)="submit()">

        <div class="grid gap-5">
              <p-floatlabel variant="on">

                <p-input-number formControlName="number"
                 [showButtons]="true"
                  inputId="basic-inputnumber"
                  [min]="0" />

                <label>{{forms_labels.counter_number}}</label>

            </p-floatlabel>

            <p-floatlabel variant="on">

                <input pInputText formControlName="code">

                <label>Code</label>

            </p-floatlabel>

            <p-floatlabel variant="on">

                <input pInputText formControlName="name">

                <label>{{forms_labels.name}}</label>

            </p-floatlabel>
            <p-floatlabel variant="on">

                <p-select class="w-full" formControlName="branchId"
                 [options]="branches()" 
                 optionLabel="name"
                    optionValue="id">

                </p-select>

                <label>{{brancheLabel[0]}}</label>

            </p-floatlabel>
          
            <p-floatlabel variant="on">

                <p-select class="w-full" formControlName="status" optionLabel="label" optionValue="value"
                    [options]="statusOptions">

                </p-select>

                <label>{{forms_labels.status}}</label>

            </p-floatlabel>
            <div class="w-full flex flex-col">

                <label htmlFor="switch">{{forms_labels.isActif[0]}}</label>
                <p-toggleswitch class="w-full" formControlName="active" inputId="switch">
                </p-toggleswitch>


            </div>
        </div>

        <div class="actions gap-4">
            <p-button pClass="self-left" type="button" severity="secondary" icon="pi pi-arrow-left" size="large"
                (onClick)="backToList()" [label]="forms_labels.back">

            </p-button>
            <p-button type="submit" icon="pi pi-save" size="large" [label]="forms_labels.save">

            </p-button>

        </div>

    </form>

</p-card>
