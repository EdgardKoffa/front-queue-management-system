<p-card 
[header]="formTitle()"

>
<div class="w-full flex flex-col gap-3 pb-4">
    <div class="w-full items-center gap-5">
        <div class="w-1/3"></div>
        <div class="w-2/3"></div>
    </div>
   <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
  <div class="bg-gray-50 dark:bg-gray-900  p-2 rounded shadow gap-3 items-center">
    <span class="font-medium">Code :</span>
    <span class="font-bold text-blue-800">{{agency()?.code}}</span>
  </div>
  <div class="bg-gray-50 dark:bg-gray-900  p-2 rounded shadow gap-3">
<span class="font-medium">{{forms_labels.name}} :</span>
    <span class="font-bold text-blue-800">{{agency()?.name}}</span>
  </div>
  <div class="bg-gray-50 dark:bg-gray-900  p-2 rounded shadow gap-3">
<span class="font-medium">{{forms_labels.phone}} :</span>
    <span class="font-bold text-blue-800">{{agency()?.phone}}</span>
  </div>
  <div class="bg-gray-50 dark:bg-gray-900  p-2 rounded shadow gap-3">
    <span class="font-medium">{{forms_labels.address}} :</span>
    <span class="font-bold text-blue-800">{{agency()?.address}}</span>
  </div>
   <div class="bg-gray-50 dark:bg-gray-900  p-2 rounded shadow gap-3">
    <span class="font-medium">{{forms_labels.city}} :</span>
    <span class="font-bold text-blue-800">{{agency()?.city}}</span>
  </div>
   <div class="bg-gray-50 dark:bg-gray-900  p-2 rounded shadow gap-3">
    <span class="font-medium">{{forms_labels.status}} :</span>
    <span class="font-bold text-blue-800">{{agency()?.status}}</span>
  </div>
</div>
</div>
</p-card>
