
<div class="sidebar bg-primary-50 dark:bg-blue-50 "
[class.collapsed]="layout.sidebarCollapsed()"
>

    <div class="sidebar-header flex justify-center w-full bg-primary-100 dark:bg-blue-100 dark:text-blue-100">
        <img
            src="/images/logo95.png"
            [alt]="applabels.name"
            class="logo self-center">

        <h2 class="text-xl font-bold text-primary-700">{{applabels.name}}</h2>
        <span class="text-gray-600 dark:text-zinc-200" i18n>{{applabels.title}} </span>

    </div>

    <p-panelMenu
        [model]="items()">
    </p-panelMenu>

</div>
