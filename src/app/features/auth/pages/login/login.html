<p-toast></p-toast>
<main class="flex justify-center h-screen items-center min-h-screen login-container">
 <div class="login-card">
  <p-card  class=" shadow-6 gap-10 w-full">
    <div class="text-center mb-2 flex flex-col">
        <div class="logo-container">
      <img
         style=' border-radius: 100%; width: 90px;aspect-ratio: 1 / 1;object-fit: cover'
        src="/images/logo.png"
        alt="NS GLOBAL"
        class="w-20 mx-auto mb-1">
      </div>
      <span class="text-3xl font-bold text-[#0000ff]">{{labels.loginTitle.name}}</span>

      <p class="text-[#808080]">{{labels.loginTitle.subtitle}}</p>
    </div>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="login()"
      class="flex  flex-col gap-5 text-[16px] p-10"
    >
      <!-- Username -->

      <p-floatlabel variant="on" spellcheck="true" >
        <input pInputText  id="username" formControlName="userName" class="w-full" />

        <label for="username"> {{labels.username}} </label>
      </p-floatlabel>
      @if (loginForm.controls.userName.invalid && loginForm.controls.userName.touched) {
        <p-message severity="error" size="small" variant="simple">
          {{labels.invalid_username}}
        </p-message>
      }
      <!-- Password -->

      <p-floatlabel variant="on">
        <p-password
          inputId="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
        >
        </p-password>

        <label for="password"> {{labels.pwd}} </label>
      </p-floatlabel>
      @if (loginForm.controls.password.invalid && loginForm.controls.password.touched) {
        <p-message severity="error" size="small" variant="simple">
         {{labels.invalid_pwd}}
        </p-message>
      }
      <!-- Remember me -->

      <div class="flex items-center gap-2 mt-6 mb-5">
        <p-checkbox binary="true" inputId="remember"> </p-checkbox>

        <label for="remember" class="cursor:pointer"> {{labels.rememberme}}</label>
      </div>

      <!-- Button -->

      <p-button
        [label]="labels.btnTitle"
        icon="pi pi-sign-in"
        type="submit"
        size="large"
        styleClass="w-full sm:[459px]"
        [disabled]="loginForm.invalid"
      >
      </p-button>
    </form>
  </p-card>
</div>
</main>
