<p-table

    [value]="data()"

    [loading]="loading()"

    stripedRows

    responsiveLayout="scroll"

    [paginator]="true"

    [rows]="10"
    [lazy]="true"
    [totalRecords]="totalRecords()"
    (onLazyLoad)="lazyLoad.emit($event)"
    >

    <ng-template pTemplate="header">
        <tr>
            @for(column of columns(); track column.field){
                <th>
                    {{column.header}}
                </th>
            }
            <th style="width:170px">
                Actions
            </th>
        </tr>

    </ng-template>

    <ng-template

        pTemplate="body"

        let-row>

        <tr>

            @for(column of columns(); track column.field){
                @if(column.isButton){
                    <td>
                        <p-button
                            [icon]="statusIcon()(row[column.field])"
                            [severity]="statusSeverity()(row[column.field])"
                            pTooltip="{{statusValue()(row[column.field])}}"
                            tooltipPosition="left"
                            
                            (onClick)="statusAction.emit(row)">
                           
                        </p-button>
                    </td>
                }
                @else{
                    <td>

                        {{row[column.field]}}

                    </td>
                }

            }

            <td>
                @if(actions().view){
                <p-button

                    icon="pi pi-eye"

                    text
                    pTooltip="{{statusEnumLabel.details}}"
                    tooltipPosition="left"
                    (onClick)="details.emit(row)">
                </p-button>
            }
             @if(actions().edit){
                <p-button

                    icon="pi pi-pencil"

                    text

                    severity="warn"
                    pTooltip="{{statusEnumLabel.edit}}"
                    tooltipPosition="left"
                    (onClick)="edit.emit(row)">
                </p-button>
            }
             @if(actions().delete){
                <p-button

                    icon="pi pi-trash"
                    text
                    severity="danger"
                    pTooltip="{{statusEnumLabel.delete}}"
                    tooltipPosition="top"
                    (onClick)="delete.emit(row)" 
                    >
                </p-button>
            }
            </td>

        </tr>

    </ng-template>

</p-table>
